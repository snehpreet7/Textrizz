<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextRizz</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#07050F;
    color:#F4F2FA;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;padding:24px;
    background-image:radial-gradient(60% 40% at 50% 0%, rgba(139,123,255,.18), transparent 70%),
                     radial-gradient(50% 35% at 80% 100%, rgba(255,105,180,.12), transparent 70%);
  }
  #escape{display:none;flex-direction:column;align-items:center;width:100%}
  #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
  .spin{width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(139,123,255,.25);border-top-color:#8B7BFF;
    animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .wordmark{
    font-size:44px;font-weight:800;letter-spacing:.02em;font-style:italic;
    background:linear-gradient(92deg,#E3A6FF,#8B7BFF);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 42px rgba(139,123,255,.35);
    margin-bottom:14px;
  }
  .tag{color:#A9A3BD;font-size:17px;margin-bottom:40px;text-align:center}
  .badge{
    display:flex;align-items:center;gap:12px;
    background:#FFFFFF;color:#0B0B0F;
    border-radius:14px;padding:14px 26px;
    text-decoration:none;
    font-size:15px;line-height:1.2;
    box-shadow:0 14px 50px rgba(139,123,255,.25);
  }
  .badge svg{width:30px;height:30px;flex:0 0 auto}
  .badge .txt small{display:block;font-size:11px;font-weight:500;color:#3C3C43}
  .badge .txt b{font-size:19px;font-weight:700}
</style>
</head>
<body>

  <div id="loading" aria-label="Redirecting">
    <div class="spin"></div>
  </div>

  <div id="escape">
    <div class="wordmark">TextRizz</div>
    <p class="tag">The AI that texts better than you.</p>
    <a class="badge" id="store" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M17.05 12.54c-.03-2.89 2.36-4.27 2.47-4.34-1.35-1.97-3.44-2.24-4.18-2.27-1.78-.18-3.47 1.05-4.37 1.05-.9 0-2.29-1.02-3.77-.99-1.94.03-3.73 1.13-4.72 2.87-2.01 3.49-.51 8.66 1.44 11.5.96 1.39 2.1 2.95 3.6 2.89 1.45-.06 1.99-.93 3.74-.93s2.24.93 3.77.9c1.56-.03 2.54-1.41 3.49-2.81 1.1-1.61 1.55-3.17 1.57-3.25-.03-.02-3.01-1.16-3.04-4.62zM14.16 4.06c.8-.97 1.34-2.32 1.19-3.66-1.15.05-2.55.77-3.38 1.74-.74.85-1.39 2.22-1.22 3.53 1.29.1 2.6-.65 3.41-1.61z"/></svg>
      <span class="txt"><small>Download on the</small><b>App Store</b></span>
    </a>
  </div>

<script>
(function(){
  var PT = "128842497";

  var params = new URLSearchParams(location.search);
  var m = location.pathname.match(/^\/(?:c|ig)\/([^\/?#]+)/i);
  var ct = ((m && m[1]) || params.get("ct") || "direct").replace(/[^a-zA-Z0-9._-]/g, "");

  var ua = navigator.userAgent || "";
  var isAndroid = /android/i.test(ua);

  var ios = "https://apps.apple.com/us/app/textrizz-stop-getting-ghosted/id6764484157"
          + "?pt=" + PT + "&mt=8&ct=" + ct;
  var android = "https://play.google.com/store/apps/details?id=com.growthvaultllc.textrizz"
          + "&utm_source=" + ct + "&utm_medium=creator";
  var store = isAndroid ? android : ios;

  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var inApp = (isIOS && !/Safari\//i.test(ua))
           || /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Bytedance|Snapchat|Twitter|Line\/|wv\)/i.test(ua);

  document.getElementById("store").href = store;

  if (inApp) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("escape").style.display = "flex";
    // Attempt to trigger the native App Store sheet where the in-app browser allows it
    if (!isAndroid) {
      setTimeout(function(){ location.href = store; }, 300);
    }
  } else {
    location.replace(store);
  }
})();
</script>
<noscript>
  <a href="https://apps.apple.com/us/app/textrizz-stop-getting-ghosted/id6764484157">Download TextRizz</a>
</noscript>
</body>
</html>
