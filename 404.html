<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextRizz — Open in Your Browser</title>
<style>
  :root{
    --bg:#07060B; --ink:#F4F2FA; --dim:#A9A3BD;
    --card:#FFFFFF; --card-ink:#171226;
    --accent:#8B7BFF; --accent2:#E3A6FF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 22px 40px; min-height:100%;
  }
  .arrow{align-self:flex-end;width:84px;height:84px;margin:4px 6px 10px 0}
  .wordmark{
    font-size:44px;font-weight:800;letter-spacing:.02em;font-style:italic;
    background:linear-gradient(92deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 42px rgba(139,123,255,.35);
    margin:6vh 0 26px;
  }
  h1{font-size:32px;font-weight:800;text-align:center;line-height:1.15}
  .sub{color:var(--dim);text-align:center;font-size:17px;line-height:1.5;margin:14px auto 30px;max-width:30ch}
  .steps{
    background:var(--card);color:var(--card-ink);border-radius:22px;
    padding:24px 22px;width:100%;max-width:420px;
    display:flex;flex-direction:column;gap:20px;
    box-shadow:0 18px 60px rgba(139,123,255,.18);
  }
  .step{display:flex;gap:14px;align-items:flex-start;font-size:17px;line-height:1.45}
  .n{flex:0 0 34px;height:34px;border-radius:50%;background:#EFEAFF;color:#6A57E8;
     display:flex;align-items:center;justify-content:center;font-weight:700}
  .step b{font-weight:700}
  .fallback{margin-top:30px;color:var(--dim);font-size:15px;text-align:center}
  .fallback a{color:var(--accent);text-decoration:none;font-weight:600}
  #escape{display:none;flex-direction:column;align-items:center;width:100%}
  #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
  .spin{width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(139,123,255,.25);border-top-color:var(--accent);
    animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

  <div id="loading" aria-label="Redirecting to the app store">
    <div class="spin"></div>
  </div>

  <div id="escape">
    <svg class="arrow" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" aria-hidden="true">
      <path d="M30 92 C 18 70, 30 48, 50 50 C 66 52, 66 70, 52 70 C 38 70, 40 44, 62 28"/>
      <path d="M50 30 L 64 24 L 60 40"/>
    </svg>
    <div class="wordmark">TEXTRIZZ</div>
    <h1>Open in Your Browser</h1>
    <p class="sub">To download the app, please open this page in Safari or Chrome.</p>
    <div class="steps">
      <div class="step"><span class="n">1</span><span>Tap the <b>three dots</b> menu (…) in the top right corner</span></div>
      <div class="step"><span class="n">2</span><span>Select <b>"Open in browser"</b></span></div>
      <div class="step"><span class="n">3</span><span>You'll be automatically redirected to download the app</span></div>
    </div>
    <p class="fallback">Or search <b>TextRizz</b> on the App Store — <a id="direct" href="#">open it directly</a></p>
  </div>

<script>
(function(){
  var PT = "128842497";

  var params = new URLSearchParams(location.search);
  var m = location.pathname.match(/^\/c\/([^\/?#]+)/i);
  var ct = ((m && m[1]) || params.get("ct") || "direct").replace(/[^a-zA-Z0-9._-]/g, "");

  var ua = navigator.userAgent || "";
  var isAndroid = /android/i.test(ua);

  var ios = "https://apps.apple.com/us/app/textrizz-stop-getting-ghosted/id6764484157"
          + "?pt=" + PT + "&mt=8&ct=" + ct;
  var android = "https://play.google.com/store/apps/details?id=com.growthvaultllc.textrizz"
          + "&utm_source=" + ct + "&utm_medium=creator";
  var store = isAndroid ? android : ios;

  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var inApp = (isIOS && !/Safari\//i.test(ua))
           || /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Bytedance|Snapchat|Twitter|Line\/|wv\)/i.test(ua);

  document.getElementById("direct").href = store;

  if (inApp) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("escape").style.display = "flex";
  } else {
    location.replace(store);
  }
})();
</script>
<noscript>
  <a href="https://apps.apple.com/us/app/textrizz-stop-getting-ghosted/id6764484157">Download TextRizz</a>
</noscript>
</body>
</html>
